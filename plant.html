<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Materia Medica</title>
        <link rel="icon" type="image/svg+xml" href="favicon.svg">
        <link rel="stylesheet" href="styles.css">
        <script src="utils.js"></script>
        <script src="i18n.js"></script>
        <script src="plants-data.js"></script>
        <script src="pdf-notes.js"></script>
        <script src="plant-page.js" defer></script>
        <script src="footer.js" defer></script>
    </head>

    <!--
        One page for every plant: plant.html?p=<fileSlug>
        Under the name: family and names, then the properties (as tags), then the written
        text; the botanical plate sits on the right beside them. At the bottom: similar plants.
        Written text comes from content/<fileSlug>.html, if it exists.
        Each [data-content] spot is filled by the <section data-section="..."> of the same name.
        On the published site, parts without text are hidden; when nothing is written yet,
        only the facts are shown.
    -->
    <body>
        <div class="container">
            <a href="index.html" class="back-link">← Back to Plant List</a>

            <article class="plant-detail">
                <header class="plant-header">
                    <h1 data-plant="name"></h1>
                    <p class="plant-latin"><em data-plant="botanical"></em></p>
                </header>

                <div class="plant-body">
                    <!-- Botanical plate, when the plant has one (plants-data.js: image, imageCredit).
                         It sits on the right; family, names, properties and text flow beside it. -->
                    <figure class="plant-plate" data-plant="plate" hidden>
                        <img alt="" loading="lazy">
                        <figcaption></figcaption>
                    </figure>

                    <!-- Family and names -->
                    <div class="plant-meta">
                        <div class="plant-meta-item">
                            <span class="plant-meta-label" data-i18n="plant.family">Family</span>
                            <span data-plant="family"></span>
                        </div>
                        <div class="plant-meta-item">
                            <span class="plant-meta-label" data-i18n="plant.commonNames">Common Names</span>
                            <div class="plant-names">
                                <span class="name-pair"><span class="name-lang" data-i18n="plant.english">English:</span> <span data-plant="name-en"></span></span>
                                <span class="name-pair"><span class="name-lang" data-i18n="plant.danish">Danish:</span> <span data-plant="name-da"></span></span>
                                <span class="name-pair"><span class="name-lang" data-i18n="plant.french">French:</span> <span data-plant="name-fr"></span></span>
                            </div>
                        </div>
                    </div>

                    <!-- The properties from the reference PDF: the most important part of the page -->
                    <section class="plant-properties" aria-labelledby="properties-heading">
                        <h2 id="properties-heading">
                            <span data-i18n="plant.properties">Properties</span>
                            <span class="property-count" data-plant="property-count"></span>
                        </h2>
                        <div class="tag-list" data-plant="properties"></div>
                    </section>

                    <div class="plant-text">
                            <div class="section">
                                <h2 data-i18n="plant.habitatGrowing">Habitat and Growing Conditions</h2>
                                <div data-content="habitat" data-placeholder="plant.ph.habitat"></div>
                            </div>

                            <div class="section">
                                <h2 data-i18n="plant.constituents">Active Constituents</h2>
                                <div data-content="constituents" data-placeholder="plant.ph.constituents"></div>
                            </div>

                            <!-- Shown only on plants that have this text -->
                            <div class="section" data-optional hidden>
                                <h2 data-i18n="plant.uses">Uses</h2>
                                <div data-content="uses"></div>
                            </div>

                            <div class="section">
                                <h2 data-i18n="plant.partsUsed">Parts Used</h2>
                                <div data-content="parts-used" data-placeholder="plant.ph.parts"></div>
                            </div>

                            <!-- Hidden for now: remove "hidden" to show these sections again -->
                            <div class="section" hidden>
                                <h2 data-i18n="plant.personal">Personal Experience</h2>
                                <h3 data-i18n="plant.taste">Taste</h3>
                                <div data-content="taste" data-placeholder="plant.ph.taste"></div>
                                <h3 data-i18n="plant.effect">Effect</h3>
                                <div data-content="effect" data-placeholder="plant.ph.effect"></div>
                            </div>

                            <div class="section" hidden>
                                <h2 data-i18n="plant.references">References</h2>
                                <div data-content="references" data-placeholder="plant.ph.references"></div>
                            </div>
                    </div>
                </div>

                <!-- At the bottom: plants with similar properties -->
                <div class="plant-facts">
                        <div class="section" data-similar-section hidden>
                            <h2 data-i18n="plant.similar">Plants with similar properties</h2>
                            <ul class="similar-list" data-plant="similar"></ul>
                        </div>
                </div>

                <!-- Previous / next plant, in the same order as the main page (by Latin name) -->
                <nav class="plant-pager" data-plant="pager" hidden></nav>
            </article>

            <div id="footer-placeholder"></div>
        </div>
    </body>

</html>
