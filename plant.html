<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Materia Medica</title>
        <link rel="icon" type="image/svg+xml" href="favicon.svg">
        <link rel="stylesheet" href="styles.css">
        <script src="utils.js"></script>
        <script src="i18n.js"></script>
        <script src="plants-data.js"></script>
        <script src="plant-page.js" defer></script>
        <script src="footer.js" defer></script>
    </head>

    <!--
        One page for every plant: plant.html?p=<fileSlug>
        Names, properties and family come from plants-data.js.
        Written text comes from content/<fileSlug>.html (if it exists);
        sections without text show the [Add ... here] placeholder.
    -->
    <body>
        <div class="container">
            <a href="index.html" class="back-link">← Back to Plant List</a>

            <div class="plant-detail">
                <h1 data-plant="name"></h1>

                <div class="section">
                    <h2 data-i18n="plant.botanicalName">Botanical Name</h2>
                    <p><em data-plant="botanical"></em></p>
                </div>
                <div class="section">
                    <h2 data-i18n="plant.commonNames">Common Names</h2>
                    <p><strong data-i18n="plant.english">English:</strong> <span data-plant="name-en"></span></p>
                    <p><strong data-i18n="plant.danish">Danish:</strong> <span data-plant="name-da"></span></p>
                    <p><strong data-i18n="plant.french">French:</strong> <span data-plant="name-fr"></span></p>
                </div>

                <div class="section clear">
                    <h2 data-i18n="plant.habitatGrowing">Habitat and Growing Conditions</h2>
                    <div data-content="habitat" data-placeholder="plant.ph.habitat"></div>
                </div>

                <div class="section clear">
                    <h2 data-i18n="plant.constituents">Active Constituents</h2>
                    <div data-content="constituents" data-placeholder="plant.ph.constituents"></div>
                </div>

                <div class="section clear">
                    <h2 data-i18n="plant.properties">Properties</h2>
                    <p data-plant="properties"></p>
                    <div data-optional hidden>
                        <h3 data-i18n="plant.uses">Uses</h3>
                        <div data-content="uses"></div>
                    </div>
                    <h3 data-i18n="plant.sideEffects">Side Effects</h3>
                    <div data-content="side-effects" data-placeholder="plant.ph.sideEffects"></div>
                </div>

                <div class="section clear">
                    <h2 data-i18n="plant.pertinent">Pertinent Information</h2>
                    <h3 data-i18n="plant.family">Family</h3>
                    <p data-plant="family"></p>
                    <h3 data-i18n="plant.partsUsed">Parts Used</h3>
                    <div data-content="parts-used" data-placeholder="plant.ph.parts"></div>
                    <h3 data-i18n="plant.forms">Forms Used and Doses</h3>
                    <div data-content="forms" data-placeholder="plant.ph.forms"></div>
                </div>

                <!-- Hidden for now: remove "hidden" to show these sections again -->
                <div class="section clear" hidden>
                    <h2 data-i18n="plant.personal">Personal Experience</h2>
                    <h3 data-i18n="plant.taste">Taste</h3>
                    <div data-content="taste" data-placeholder="plant.ph.taste"></div>
                    <h3 data-i18n="plant.effect">Effect</h3>
                    <div data-content="effect" data-placeholder="plant.ph.effect"></div>
                </div>

                <div class="section clear" hidden>
                    <h2 data-i18n="plant.references">References</h2>
                    <div data-content="references" data-placeholder="plant.ph.references"></div>
                </div>
            </div>

            <div id="footer-placeholder"></div>
        </div>
    </body>

</html>
