<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Complete multilingual index of medicinal properties with plant counts and listings in English, Danish, and French">
        <title data-i18n-title="props.pageTitle">Medicinal Properties - Materia Medica</title>
        <link rel="icon" type="image/svg+xml" href="favicon.svg">
        <link rel="stylesheet" href="styles.css">
        <script src="utils.js"></script>
        <script src="i18n.js"></script>
        <script src="navigation.js" defer></script>
        <script src="footer.js" defer></script>
        <script src="plants-data.js"></script>
        <script src="pdf-notes.js"></script>
        <script src="property-statistics-renderer.js"></script>
    </head>

    <body>
        <a href="#main-content" class="skip-link" data-i18n="a11y.skip">Skip to main content</a>
        <div class="container">
            <header>
                <h1 data-i18n="props.pageTitle">Medicinal Properties</h1>
            </header>

            <div id="nav-placeholder"></div>

            <main id="main-content">
                <div class="prop-stats" id="prop-stats"></div>

                <div class="prop-toolbar">
                    <div class="search-box-stats">
                        <label for="property-search" class="visually-hidden" data-i18n="props.search.label">Search properties or plants</label>
                        <input type="search" id="property-search" placeholder="Search properties or plants..."
                            data-i18n-placeholder="props.search.placeholder" autocomplete="off" />
                    </div>
                    <div class="prop-controls">
                        <div class="segmented" role="group" data-i18n-aria-label="props.sort.label" aria-label="Sort">
                            <button type="button" data-sort="name" data-i18n="props.sort.name">A–Z</button>
                            <button type="button" data-sort="count" data-i18n="props.sort.count">Most plants</button>
                        </div>
                        <button type="button" class="link-button" id="toggle-all">Expand all</button>
                    </div>
                </div>

                <nav class="az-bar" id="az-bar" aria-label="A–Z"></nav>

                <div class="prop-list" id="property-list"></div>
                <p class="prop-empty" id="prop-empty" hidden data-i18n="props.noResults">No properties or plants match your search.</p>
                <div id="search-results-announcement" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
            </main>

            <div id="footer-placeholder"></div>
        </div>
    </body>

</html>
